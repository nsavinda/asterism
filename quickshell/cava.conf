# cava config for the lyrics overlay → install to ~/.config/quickshell/lyrics/cava.conf
# Prints 12 levels (0-100, low → high frequency) per line, 60 times a second.
[general]
framerate = 60
autosens = 1
bars = 12

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average

[smoothing]
noise_reduction = 15
